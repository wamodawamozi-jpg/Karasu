<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="烏の棲む空">
<title>烏の棲む空 — Focus 120</title>
<style>
:root{--sky1:#263642;--sky2:#586874;--sky3:#b0b4b0;--ink:#121b20;--gold:#d4c4a0;--mist:0;}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17212a;color:#eee;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
body{min-height:100dvh}.scene{position:fixed;inset:0;background:linear-gradient(180deg,var(--sky1),var(--sky2) 55%,var(--sky3));transition:background 12s ease;overflow:hidden}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,12,18,.18),transparent 45%,rgba(7,12,16,.48));pointer-events:none}
.cloud{position:absolute;width:45vw;height:16vh;border-radius:50%;background:rgba(210,220,220,.13);filter:blur(28px);top:12%;left:-15%;animation:drift 70s linear infinite}.cloud.c2{top:32%;left:55%;width:60vw;animation-duration:92s;opacity:.7}.cloud.c3{top:5%;left:40%;width:35vw;animation-duration:115s;opacity:.5}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}
.moon{position:absolute;top:14%;right:14%;width:72px;height:72px;border-radius:50%;background:rgba(235,229,209,.72);box-shadow:0 0 40px rgba(236,230,210,.2);opacity:.65;transition:opacity 4s}
.rain{position:absolute;inset:-20% 0;opacity:0;background-image:repeating-linear-gradient(105deg,transparent 0 14px,rgba(210,230,240,.22) 15px 16px,transparent 17px 28px);animation:rainfall .5s linear infinite;transition:opacity 3s}@keyframes rainfall{to{transform:translateY(35px)}}
.fog{position:absolute;inset:35% -30%;background:rgba(210,215,216,.2);filter:blur(35px);opacity:0;animation:fogmove 35s ease-in-out infinite alternate;transition:opacity 5s}@keyframes fogmove{to{transform:translateX(20%)}}
.city{position:absolute;bottom:0;width:100%;height:31%;display:flex;align-items:end;gap:3px;opacity:.8}.building{background:linear-gradient(#263139,#11191e);width:var(--w);height:var(--h);position:relative}.building:before{content:"";position:absolute;inset:10px 5px;background:repeating-linear-gradient(90deg,rgba(220,190,135,.18) 0 3px,transparent 4px 12px),repeating-linear-gradient(0deg,transparent 0 12px,rgba(230,210,160,.1) 13px 14px)}
.tree{position:absolute;bottom:13%;left:6%;width:3px;height:32%;background:#171e20;transform-origin:bottom;animation:sway 7s ease-in-out infinite}.tree:before,.tree:after{content:"";position:absolute;width:3px;height:70%;background:#171e20;top:0;transform-origin:bottom}.tree:before{transform:rotate(-28deg);height:55%}.tree:after{transform:rotate(25deg);height:60%;top:8%}@keyframes sway{50%{transform:rotate(2deg)}}
.bird{position:absolute;width:46px;height:24px;left:var(--x,50%);top:var(--y,25%);color:#0d151a;filter:drop-shadow(0 3px 4px #121a20);animation:birdfloat 4s ease-in-out infinite}.bird svg{width:100%;height:100%;overflow:visible}.wing{transform-origin:50% 90%;animation:flap .8s ease-in-out infinite alternate}.bird.perched .wing{animation:slowflap 6s ease-in-out infinite}.bird.preen{animation:preen 1.5s ease-in-out}.bird.new{animation:arrive 3s ease-out, birdfloat 4s ease-in-out 3s infinite}@keyframes flap{from{transform:rotate(-12deg)}to{transform:rotate(30deg)}}@keyframes slowflap{0%,75%,100%{transform:rotate(0)}80%{transform:rotate(35deg)}90%{transform:rotate(-8deg)}}@keyframes birdfloat{50%{translate:0 -9px}}@keyframes arrive{from{transform:translate(35vw,-25vh) scale(.6);opacity:0}to{transform:translate(0,0) scale(1);opacity:1}}@keyframes preen{50%{rotate:12deg;scale:.95}}
.panel{position:absolute;z-index:4;top:50%;left:50%;transform:translate(-50%,-50%);width:min(90vw,460px);text-align:center;padding:22px 20px 26px;background:rgba(13,22,28,.32);border:1px solid rgba(240,240,230,.14);border-radius:24px;backdrop-filter:blur(8px);box-shadow:0 15px 50px rgba(0,0,0,.12)}
.kicker{letter-spacing:.28em;font-size:11px;color:#d7d1c5;opacity:.9}.title{font-size:clamp(22px,6vw,30px);letter-spacing:.12em;margin:8px 0 2px;font-weight:500}.subtitle{font-size:11px;letter-spacing:.16em;color:#c9c9c4}.clock{font-size:clamp(58px,17vw,94px);font-variant-numeric:tabular-nums;font-weight:200;letter-spacing:.02em;line-height:1.2;margin:20px 0 10px;text-shadow:0 3px 20px rgba(0,0,0,.2)}.progress{height:3px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;margin:0 3% 16px}.bar{height:100%;width:0;background:var(--gold);transition:width 1s linear}.quote{min-height:42px;font-size:13px;line-height:1.8;color:#e1dfd9;margin:12px 0}.buttons{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.button{border:1px solid rgba(255,255,255,.35);background:rgba(12,20,25,.2);color:#f4f2ec;padding:11px 22px;border-radius:30px;letter-spacing:.08em;font-size:13px}.button.primary{background:rgba(218,205,174,.2);border-color:rgba(218,205,174,.55)}.smallrow{display:flex;justify-content:center;gap:14px;margin-top:15px;font-size:11px;color:#d2d0c8}.fullbtn{position:absolute;z-index:6;right:14px;top:calc(env(safe-area-inset-top) + 12px);padding:8px 12px;border-radius:20px;border:1px solid #ffffff35;background:#18232b66;color:#eee;font-size:11px}.status{position:absolute;z-index:3;bottom:calc(env(safe-area-inset-bottom) + 12px);left:0;right:0;text-align:center;color:#e0ddd5;font-size:11px;letter-spacing:.14em}.done{display:none;position:absolute;z-index:10;inset:0;background:rgba(20,27,30,.55);backdrop-filter:blur(7px);align-items:center;justify-content:center;text-align:center;padding:25px}.done.show{display:flex}.done h2{font-weight:400;letter-spacing:.12em;font-size:30px}.done p{line-height:2;color:#dedbd3}.done button{margin-top:10px}
@media(max-height:650px){.panel{padding:12px 16px}.clock{margin:8px 0}.quote{min-height:28px;margin:6px 0}.title{font-size:22px}}
@media(max-width:480px){.panel{width:min(92vw,460px);padding:18px 16px 20px}.clock{font-size:clamp(48px,15vw,82px)}.fullbtn{top:calc(env(safe-area-inset-top) + 8px);right:10px}}
</style>
</head>
<body>
<div class="scene" id="scene"><div class="cloud"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="moon" id="moon"></div><div class="rain" id="rain"></div><div class="fog" id="fog"></div><div class="tree"></div><div class="city" id="city"></div><div id="birds"></div>
<div class="panel"><div class="kicker">FOCUS · 120 MINUTES</div><div class="title">烏の棲む空</div><div class="subtitle">静かに、確かに。</div><div class="clock" id="clock">02:00:00</div><div class="progress"><div class="bar" id="bar"></div></div><div class="quote" id="quote">今日決めたことを、今日の行動にする。</div><div class="buttons"><button class="button primary" id="start">開始</button><button class="button" id="reset">リセット</button></div><div class="smallrow"><span id="weatherLabel">曇天</span><span id="birdCount">烏 1羽</span></div></div>
<button class="fullbtn" id="full">全画面</button><div class="status">誠実と一貫 — KEEP YOUR WORD</div>
<div class="done" id="done" style="display:none"><div><h2>120分、完遂。</h2><p>空が晴れた。<br>今日の自分との約束を、守ったね。</p><button class="button primary" id="closeDone">空に戻る</button></div></div></div>
<script>
const TOTAL=7200;let remaining=TOTAL,running=false,last=null,spawnTimer=null,weatherTimer=null,birdsN=1,spawnCount=0;const $=id=>document.getElementById(id);const quotes=['今日決めたことを、今日の行動にする。','集中が途切れても、戻ってくればいい。','一羽で始めた空に、仲間が増えていく。','静かに、確かに。','目の前の一問に、誠実であれ。','自由は、自分で決めたことを守ること。','羽を休めても、飛ぶことを忘れない。'];
const svgBird=`<svg viewBox="0 0 100 50" aria-hidden="true"><path d="M15 30 Q30 8 48 26 Q60 10 85 12 Q67 29 53 34 Q35 43 15 30Z" fill="currentColor"/><path class="wing" d="M35 28 Q18 8 4 6 Q17 30 36 34Z" fill="currentColor"/><circle cx="70" cy="23" r="2" fill="#b6b8b3"/><path d="M85 22 L98 25 L85 27Z" fill="#171d20"/></svg>`;
function addBird(isNew=false){if(birdsN>=6)return;const el=document.createElement('div');el.className='bird'+(isNew?' new':' perched');el.innerHTML=svgBird;el.style.setProperty('--x',(12+Math.random()*75)+'%');el.style.setProperty('--y',(12+Math.random()*42)+'%');$('birds').appendChild(el);birdsN++;$('birdCount').textContent='烏 '+birdsN+'羽';if(isNew){spawnCount++;$('quote').textContent=spawnCount%2?'……お前、いつからそこにいた？':'新しい烏がやってきた。';setTimeout(()=>{el.classList.remove('new');el.classList.add('perched')},3200)}setTimeout(()=>{if(Math.random()<.55)el.classList.add('preen');setTimeout(()=>el.classList.remove('preen'),1600)},7000+Math.random()*15000)}
function scheduleBird(){if(!running)return;spawnTimer=setTimeout(()=>{if(running&&birdsN<6)addBird(true);scheduleBird()},35000+Math.random()*65000)}
function setWeather(w){let s=$('scene');if(w==='rain'){ $('rain').style.opacity='.5';$('fog').style.opacity='0';$('weatherLabel').textContent='雨'}else if(w==='fog'){$('rain').style.opacity='0';$('fog').style.opacity='.75';$('weatherLabel').textContent='霧'}else if(w==='clear'){$('rain').style.opacity='0';$('fog').style.opacity='0';s.style.background='linear-gradient(180deg,#536b78,#a8b7b7 55%,#d5cbb3)';$('moon').style.opacity='.15';$('weatherLabel').textContent='晴れ間'}else{$('rain').style.opacity='0';$('fog').style.opacity='0';$('weatherLabel').textContent='曇天'}}
function update(){let h=Math.floor(remaining/3600),m=Math.floor((remaining%3600)/60),s=remaining%60;$('clock').textContent=[h,m,s].map(v=>String(v).padStart(2,'0')).join(':');$('bar').style.width=((TOTAL-remaining)/TOTAL*100)+'%';if(remaining<=5400&&remaining>3600)setWeather('rain');else if(remaining<=3600&&remaining>1800)setWeather('fog');else if(remaining<=1800)setWeather('clear');else setWeather('cloud')}
function tick(){if(!running)return;let now=Date.now();if(last!==null){let elapsed=Math.floor((now-last)/1000);if(elapsed>0){remaining=Math.max(0,remaining-elapsed);last=now;update()}}if(remaining<=0){running=false;clearTimeout(spawnTimer);showDone();$('start').textContent='開始';return}requestAnimationFrame(tick)}
$('start').onclick=()=>{if(running){running=false;last=null;clearTimeout(spawnTimer);$('start').textContent='再開';$('quote').textContent='休憩。戻る場所はここ。'}else{running=true;last=Date.now();$('start').textContent='一時停止';scheduleBird();requestAnimationFrame(tick)}};
$('reset').onclick=()=>{running=false;clearTimeout(spawnTimer);remaining=TOTAL;last=null;update();$('start').textContent='開始';$('quote').textContent='今日決めたことを、今日の行動にする。';$('done').classList.remove('show');$('done').style.display='none';$('birds').innerHTML='';birdsN=0;spawnCount=0;addBird(false)};
$('full').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){$('full').textContent='Safariでは全画面非対応の場合あり'}};
$('closeDone').onclick=()=>{$('done').classList.remove('show');$('done').style.display='none'};
// Ensure the completion overlay never blocks controls before the timer finishes.
function showDone(){ $('done').style.display='flex'; $('done').classList.add('show'); }

for(let i=0;i<26;i++){let b=document.createElement('div');b.className='building';b.style.setProperty('--w',(3+Math.random()*6)+'%');b.style.setProperty('--h',(18+Math.random()*75)+'%');$('city').appendChild(b)}
addBird(false);update();
</script>
</body>
</html>
